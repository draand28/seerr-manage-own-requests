services:
  seerr:
    # Pull the prebuilt image (once the GHCR workflow has published it)...
    image: ghcr.io/draand28/seerr-manage-own-requests:latest
    # ...or build it locally instead:
    # build: .
    container_name: seerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # To make the app itself listen on a different internal port, set PORT
      # and map the same number on both sides (e.g. PORT=30357 + 30357:30357).
      # - PORT=30357
    ports:
      # host:container - change the left side to whatever host port you use.
      - 30357:5055
    volumes:
      - ./config:/app/config
    restart: unless-stopped
