services:
  seerr:
    # Pull the prebuilt image (once the GHCR workflow has published it)...
    image: ghcr.io/draand28/seerr-manage-own-requests:latest
    # ...or build it locally instead:
    # build: .
    container_name: seerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # The image already sets PORT=30357. Override here only to change it.
      # - PORT=30357
    ports:
      # host:container; the image listens on 30357.
      - 30357:30357
    # Instead of `ports`, you can use host networking (no mapping needed):
    # network_mode: host
    volumes:
      - ./config:/app/config
    restart: unless-stopped
